name: Check builds
on:
  - push
  - pull_request

jobs:
  eval:
    name: Check evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up SSH keys
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          sudo mkdir -p /root/.ssh
          printf '%s\n' "$SSH_KEY" | sudo sh -c 'umask 0077 && tee /root/.ssh/id_ed25519' >/dev/null

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | sh -c 'umask 0077 && tee ~/.ssh/id_ed25519' >/dev/null

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - name: Set substituters
        env:
          NIX_EXTRA_SUBSTITUTERS: ${{ vars.NIX_EXTRA_SUBSTITUTERS }}
        run: |
          available_substituters=()
          for s in $NIX_EXTRA_SUBSTITUTERS; do
              if nix store info --store "$s"; then
                  available_substituters+=("$s")
              fi
          done

          if (( "${#available_substituters[*]}" > 0 )); then
              NIX_CONFIG="${NIX_CONFIG:+"$NIX_CONFIG"$'\n'}extra-substituters = ${available_substituters[*]}"
              {
                  echo 'NIX_CONFIG<<EOF'
                  printf '%s\n' "$NIX_CONFIG"
                  echo EOF
              } >>"$GITHUB_ENV"
          fi

      - name: Check evaluation
        run: nix flake check --no-build --all-systems --keep-going

  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up SSH keys
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          sudo mkdir -p /root/.ssh
          printf '%s\n' "$SSH_KEY" | sudo sh -c 'umask 0077 && tee /root/.ssh/id_ed25519' >/dev/null

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | sh -c 'umask 0077 && tee ~/.ssh/id_ed25519' >/dev/null

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
          extra_nix_config: |
            extra-trusted-public-keys = ${{ vars.NIX_EXTRA_TRUSTED_PUBLIC_KEYS }}

      - name: Set substituters
        env:
          NIX_EXTRA_SUBSTITUTERS: ${{ vars.NIX_EXTRA_SUBSTITUTERS }}
        run: |
          available_substituters=()
          for s in $NIX_EXTRA_SUBSTITUTERS; do
              if nix store info --store "$s"; then
                  available_substituters+=("$s")
              fi
          done

          if (( "${#available_substituters[*]}" > 0 )); then
              NIX_CONFIG="${NIX_CONFIG:+"$NIX_CONFIG"$'\n'}extra-substituters = ${available_substituters[*]}"
              {
                  echo 'NIX_CONFIG<<EOF'
                  printf '%s\n' "$NIX_CONFIG"
                  echo EOF
              } >>"$GITHUB_ENV"
          fi

      - name: Check formatting
        run: nix fmt -- --ci

  run-tests:
    name: Run tests
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        system:
          - x86_64-linux
          - aarch64-linux

        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm

    steps:
      - name: Recover runner disk space
        uses: wimpysworld/nothing-but-nix@v10

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up SSH keys
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          sudo mkdir -p /root/.ssh
          printf '%s\n' "$SSH_KEY" | sudo sh -c 'umask 0077 && tee /root/.ssh/id_ed25519' >/dev/null

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | sh -c 'umask 0077 && tee ~/.ssh/id_ed25519' >/dev/null

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - name: Set substituters
        env:
          NIX_EXTRA_SUBSTITUTERS: ${{ vars.NIX_EXTRA_SUBSTITUTERS }}
        run: |
          available_substituters=()
          for s in $NIX_EXTRA_SUBSTITUTERS; do
              if nix store info --store "$s"; then
                  available_substituters+=("$s")
              fi
          done

          if (( "${#available_substituters[*]}" > 0 )); then
              NIX_CONFIG="${NIX_CONFIG:+"$NIX_CONFIG"$'\n'}extra-substituters = ${available_substituters[*]}"
              {
                  echo 'NIX_CONFIG<<EOF'
                  printf '%s\n' "$NIX_CONFIG"
                  echo EOF
              } >>"$GITHUB_ENV"
          fi

      - name: Run checks
        timeout-minutes: 345
        env:
          NIX_SYSTEM: ${{ matrix.system }}
        run: |
          mkdir -p results
          nix eval --json --apply builtins.attrNames ".#checks.$NIX_SYSTEM" |
              jq --raw-output '.[] | ".#checks.\($ENV.NIX_SYSTEM).\(.)"' |
              nix build --stdin --out-link results/result --keep-going

      - name: Cache build results
        if: always()
        env:
          CACHE_TARGETS: ${{ vars.NIX_CACHE_TARGETS }}
        run: |
          if [[ ! -e results ]]; then
              # Results directroy wasn't even created, so quit now.
              exit 0
          elif ! command -v nix >/dev/null; then
              # Nix failed to install, so quit now
              exit 0
          fi

          ls -Al results

          mapfile -d '' -t build_results < <(find results -type l -printf '%l\0')
          wait "$!" # Check return code from `find`

          if (( ${#build_results[*]} == 0 )); then
              # Nothing to upload
              exit 0
          fi

          for t in $DEPLOY_TARGETS; do
              nix copy --to "$t" "${build_results[@]}"
          done
